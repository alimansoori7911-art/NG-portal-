<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" fill="none" role="img" aria-label="حباب گفتگو با علامت سؤال">
  <!-- تصویر باکس CTA — در هر سه صفحه تکرار می‌شود. -->
  <defs>
    <linearGradient id="cbub" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1474FF" stop-opacity=".28"/>
      <stop offset="100%" stop-color="#0047AD" stop-opacity=".08"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1474FF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#1474FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="csoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <circle cx="80" cy="80" r="70" fill="url(#cglow)"/>

  <g filter="url(#csoft)">
    <!-- حباب اصلی با دنباله -->
    <path d="M36 40 H124 A12 12 0 0 1 136 52 V104 A12 12 0 0 1 124 116 H72 L50 134 V116 H36 A12 12 0 0 1 24 104 V52 A12 12 0 0 1 36 40 Z"
          fill="url(#cbub)" stroke="#4792FF" stroke-width="2.25" stroke-linejoin="round"/>
    <!-- علامت سؤال -->
    <path d="M67 70 A13 13 0 1 1 80 85 V92" stroke="#ADCFFF" stroke-width="6" stroke-linecap="round" fill="none"/>
    <circle cx="80" cy="104" r="3.75" fill="#ADCFFF"/>
  </g>

  <g fill="#4792FF">
    <circle cx="20" cy="30" r="2" opacity=".5"/>
    <circle cx="142" cy="34" r="2.2" opacity=".45"/>
    <circle cx="140" cy="128" r="1.8" opacity=".4"/>
  </g>
</svg>
